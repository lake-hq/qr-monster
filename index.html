<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QR Code Generator</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#14171c;--muted:#6a7280;--border:#dde1e7;--accent:#2f5bea;--accent-text:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#181b21;--text:#eceef2;--muted:#98a0ad;--border:#2a2f38;--accent:#6c8cff;--accent-text:#0b1020;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#181b21;--text:#eceef2;--muted:#98a0ad;--border:#2a2f38;--accent:#6c8cff;--accent-text:#0b1020;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
main{max-width:520px;margin:0 auto;padding:28px 16px}
h1{font-size:1.4rem;margin:0 0 4px}
p.sub{margin:0 0 20px;color:var(--muted);font-size:.95rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}
label{display:block;font-size:.85rem;font-weight:600;margin-bottom:6px}
textarea{width:100%;min-height:90px;resize:vertical;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}
textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap}
.row>div{flex:1;min-width:130px}
select,input[type=color]{width:100%;height:38px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;padding:0 8px}
input[type=color]{padding:3px}
#out{margin-top:18px;text-align:center}
#preview{display:inline-block;background:#fff;border-radius:10px;padding:0;line-height:0;max-width:100%}
#preview svg{width:min(300px,100%);height:auto;display:block}
.empty{color:var(--muted);font-size:.9rem;padding:40px 0}
.btns{display:flex;gap:10px;margin-top:16px;justify-content:center;flex-wrap:wrap}
button{border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:600;background:var(--accent);color:var(--accent-text);cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
#msg{min-height:1.4em;margin-top:10px;font-size:.85rem;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>QR Code Generator</h1>
  <p class="sub">Enter a URL or any text. Download as SVG or PNG.</p>
  <div class="card">
    <label for="txt">URL or text</label>
    <textarea id="txt" placeholder="https://example.com"></textarea>
    <div class="row">
      <div><label for="ecc">Error correction</label>
        <select id="ecc"><option value="L">Low (7%)</option><option value="M" selected>Medium (15%)</option><option value="Q">Quartile (25%)</option><option value="H">High (30%)</option></select></div>
      <div><label for="fg">Foreground</label><input type="color" id="fg" value="#000000"></div>
      <div><label for="bg">Background</label><input type="color" id="bg" value="#ffffff"></div>
    </div>
    <div id="out">
      <div id="preview"></div>
      <div class="btns">
        <button id="dlSvg" disabled>Download SVG</button>
        <button id="dlPng" disabled>Download PNG</button>
      </div>
      <div id="msg" role="status"></div>
    </div>
  </div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var txt=$('txt'),preview=$('preview'),msg=$('msg'),dlSvg=$('dlSvg'),dlPng=$('dlPng');
  var current=null, downloads=null;

  function build(){
    var text=txt.value.trim();
    msg.textContent='';
    if(!text){current=null;preview.innerHTML='<div class="empty">Your QR code will appear here</div>';dlSvg.disabled=dlPng.disabled=true;return}
    if(typeof qrcode!=='function'){preview.innerHTML='<div class="empty">QR library failed to load.</div>';return}
    var qr;
    try{qr=qrcode(0,$('ecc').value);qr.addData(text,'Byte');qr.make()}
    catch(e){current=null;preview.innerHTML='<div class="empty">Text is too long for a QR code.</div>';dlSvg.disabled=dlPng.disabled=true;return}
    var n=qr.getModuleCount(),q=4,size=n+q*2,fg=$('fg').value,bg=$('bg').value,d='';
    for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(qr.isDark(r,c))d+='M'+(c+q)+' '+(r+q)+'h1v1h-1z';
    var svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+size+' '+size+'" shape-rendering="crispEdges"><rect width="'+size+'" height="'+size+'" fill="'+bg+'"/><path d="'+d+'" fill="'+fg+'"/></svg>';
    current={svg:svg,size:size};
    preview.innerHTML=svg;
    dlSvg.disabled=dlPng.disabled=!downloads;
    if(!downloads)msg.textContent='Downloads are unavailable in this view.';
  }

  function toPng(){
    return new Promise(function(res,rej){
      var scale=Math.ceil(1024/current.size),px=current.size*scale;
      var img=new Image();
      img.onload=function(){
        var cv=document.createElement('canvas');cv.width=cv.height=px;
        var ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.drawImage(img,0,0,px,px);
        cv.toBlob(function(b){b?res(b):rej(new Error('PNG failed'))},'image/png');
      };
      img.onerror=function(){rej(new Error('Render failed'))};
      img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(current.svg);
    });
  }

  function save(name,data){
    if(!downloads)return;
    downloads.save({filename:name,data:data}).then(function(){msg.textContent='Saved '+name}).catch(function(e){
      msg.textContent=e&&e.code==='declined'?'Download cancelled.':'Could not save file.';
    });
  }

  dlSvg.onclick=function(){if(current)save('qrcode.svg',current.svg)};
  dlPng.onclick=function(){if(current)toPng().then(function(b){save('qrcode.png',b)}).catch(function(){msg.textContent='Could not create PNG.'})};

  ['input','change'].forEach(function(ev){[txt,$('ecc'),$('fg'),$('bg')].forEach(function(el){el.addEventListener(ev,build)})});
  build();

  if(window.claude&&claude.use){
    claude.use('downloads').then(function(d){downloads=d;build()}).catch(function(){});
  }
})();
</script>
</body>
</html>
